<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-label="Inside a workspace: Claude Code reads .claude/skills, a link to .agents/skills/, where your skills link to your clone and third-party ones are pinned copies" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a1a1a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g filter="url(#shadow)"><rect x="0" y="95" width="150" height="70" rx="12" fill="#ffffff" stroke="#e3e3e3"/></g><text x="16" y="125" font-size="14" font-weight="700" fill="#171717">Claude Code</text><text x="16" y="144" font-size="12" fill="#666666">reads</text><g filter="url(#shadow)"><rect x="210" y="95" width="170" height="70" rx="12" fill="#ffffff" stroke="#e3e3e3"/></g><text x="226" y="125" font-size="14" font-weight="700" fill="#171717">.claude/skills</text><text x="226" y="144" font-size="12" fill="#666666">a link</text><g filter="url(#shadow)"><rect x="440" y="95" width="170" height="70" rx="12" fill="#ffffff" stroke="#e3e3e3"/></g><text x="456" y="125" font-size="14" font-weight="700" fill="#171717">.agents/skills/</text><text x="456" y="144" font-size="12" fill="#666666">one per skill</text><g filter="url(#shadow)"><rect x="690" y="10" width="290" height="100" rx="12" fill="#ffffff" stroke="#e3e3e3"/></g><rect x="690" y="22" width="3" height="76" rx="1.5" fill="#D77655"/><text x="706" y="37" font-size="14" font-weight="700" fill="#171717">session-archive/</text><text x="706" y="56" font-size="12" fill="#666666">a link to config/skills/</text><text x="706" y="75" font-size="12" fill="#666666">in your clone: an edit is</text><text x="706" y="94" font-size="12" fill="#666666">live everywhere at once</text><g filter="url(#shadow)"><rect x="690" y="150" width="290" height="100" rx="12" fill="#ffffff" stroke="#e3e3e3"/></g><rect x="690" y="162" width="3" height="76" rx="1.5" fill="#376B80"/><text x="706" y="177" font-size="14" font-weight="700" fill="#171717">humanizer/</text><text x="706" y="196" font-size="12" fill="#666666">a third-party skill:</text><text x="706" y="215" font-size="12" fill="#666666">an installed copy, pinned</text><text x="706" y="234" font-size="12" fill="#666666">in skills-lock.json</text><path d="M150 130L206 130" fill="none" stroke="#a1a1a1" stroke-width="1.6" marker-end="url(#head)"/><path d="M380 130L436 130" fill="none" stroke="#a1a1a1" stroke-width="1.6" marker-end="url(#head)"/><path d="M610 120C648 120 648 60 686 60" fill="none" stroke="#a1a1a1" stroke-width="1.6" marker-end="url(#head)"/><text x="682" y="40" font-size="11" text-anchor="end" fill="#666666">your own</text><path d="M610 140C648 140 648 200 686 200" fill="none" stroke="#a1a1a1" stroke-width="1.6" marker-end="url(#head)"/><text x="682" y="228" font-size="11" text-anchor="end" fill="#666666">npx skills</text>
</svg>
