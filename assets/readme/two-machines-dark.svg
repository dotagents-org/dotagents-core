<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="124" viewBox="0 0 1060 124" role="img" aria-label="Two machines, one setup: push from one, dotagents update --all on the other" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g filter="url(#shadow)"><rect x="0" y="10" width="260" height="100" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="0" y="22" width="3" height="76" rx="1.5" fill="#e39478"/><text x="16" y="37" font-size="14" font-weight="700" fill="#ededed">Machine A</text><text x="16" y="56" font-size="12" fill="#a0a0a0">edit a skill or a rule:</text><text x="16" y="75" font-size="12" fill="#a0a0a0">live at once in every</text><text x="16" y="94" font-size="12" fill="#a0a0a0">workspace on A</text><g filter="url(#shadow)"><rect x="400" y="25" width="180" height="70" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="416" y="55" font-size="14" font-weight="700" fill="#ededed">GitHub</text><text x="416" y="74" font-size="12" fill="#a0a0a0">your dotagents</text><g filter="url(#shadow)"><rect x="800" y="10" width="260" height="100" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="800" y="22" width="3" height="76" rx="1.5" fill="#6fa3b8"/><text x="816" y="37" font-size="14" font-weight="700" fill="#ededed">Machine B</text><text x="816" y="56" font-size="12" fill="#a0a0a0">pulled, reinstalled,</text><text x="816" y="75" font-size="12" fill="#a0a0a0">every workspace</text><text x="816" y="94" font-size="12" fill="#a0a0a0">refreshed</text><path d="M260 60L396 60" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><rect x="291.2" y="48" width="77.6" height="24" rx="12" fill="#ededed"/><text x="330" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="#0a0a0a">git push</text><path d="M580 60L796 60" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><rect x="598.8" y="48" width="178.4" height="24" rx="12" fill="#ededed"/><text x="688" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="#0a0a0a">dotagents update --all</text>
</svg>
