<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="How it works: your clone's config goes to ~/.claude with dotagents install, and to a workspace with dotagents new or init" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="330" height="300" rx="16" fill="#0a0a0a" stroke="#2b2b2b" stroke-dasharray="4 4"/><text x="16" y="22" font-size="11" letter-spacing="1" fill="#a0a0a0">YOUR DOTAGENTS CLONE</text><g filter="url(#shadow)"><rect x="20" y="40" width="290" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="20" y="52" width="3" height="86" rx="1.5" fill="#e39478"/><text x="36" y="72" font-size="14" font-weight="700" fill="#ededed">config/</text><text x="36" y="91" font-size="12" fill="#a0a0a0">your configuration:</text><text x="36" y="110" font-size="12" fill="#a0a0a0">instructions, rules, settings,</text><text x="36" y="129" font-size="12" fill="#a0a0a0">skills, the accounts' icons</text><g filter="url(#shadow)"><rect x="20" y="170" width="290" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="20" y="182" width="3" height="86" rx="1.5" fill="#6fa3b8"/><text x="36" y="202" font-size="14" font-weight="700" fill="#ededed">standards/ + templates/</text><text x="36" y="221" font-size="12" fill="#a0a0a0">how a workspace looks:</text><text x="36" y="240" font-size="12" fill="#a0a0a0">AGENTS.md, .agents/,</text><text x="36" y="259" font-size="12" fill="#a0a0a0">.artifacts/</text><g filter="url(#shadow)"><rect x="560" y="40" width="300" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="576" y="72" font-size="14" font-weight="700" fill="#ededed">~/.claude</text><text x="576" y="91" font-size="12" fill="#a0a0a0">every profile on the machine:</text><text x="576" y="110" font-size="12" fill="#a0a0a0">CLAUDE.md, rules/,</text><text x="576" y="129" font-size="12" fill="#a0a0a0">settings.json</text><g filter="url(#shadow)"><rect x="560" y="170" width="300" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="576" y="202" font-size="14" font-weight="700" fill="#ededed">app-workspace/</text><text x="576" y="221" font-size="12" fill="#a0a0a0">AGENTS.md, .agents/skills/,</text><text x="576" y="240" font-size="12" fill="#a0a0a0">.artifacts/, and app/:</text><text x="576" y="259" font-size="12" fill="#a0a0a0">the project's clone, untouched</text><path d="M310 95L556 95" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><rect x="361.8" y="83" width="142.39999999999998" height="24" rx="12" fill="#ededed"/><text x="433" y="99" font-size="12" font-weight="600" text-anchor="middle" fill="#0a0a0a">dotagents install</text><path d="M310 225L556 225" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><rect x="354.6" y="213" width="156.79999999999998" height="24" rx="12" fill="#ededed"/><text x="433" y="229" font-size="12" font-weight="600" text-anchor="middle" fill="#0a0a0a">dotagents new, init</text>
</svg>
