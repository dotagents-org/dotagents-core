<svg xmlns="http://www.w3.org/2000/svg" width="990" height="300" viewBox="0 0 990 300" role="img" aria-label="Several accounts, one view: switch puts a profile's login in each side's slot, and the usage of every account shows in the terminal and, through dotagents start, in the dotagents sidebar" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="300" height="300" rx="16" fill="#0a0a0a" stroke="#2b2b2b" stroke-dasharray="4 4"/><text x="16" y="22" font-size="11" letter-spacing="1" fill="#a0a0a0">PROFILES</text><g filter="url(#shadow)"><rect x="20" y="40" width="260" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="20" y="52" width="3" height="86" rx="1.5" fill="#e39478"/><svg x="32" y="79" width="32" height="32" viewBox="-6 -6 112 112" overflow="visible"><rect x="12" y="12" width="76" height="76" rx="18" fill="#e39478"/></svg><text x="72" y="72" font-size="14" font-weight="700" fill="#ededed">turing</text><text x="72" y="91" font-size="12" fill="#a0a0a0">a claude.ai account,</text><text x="72" y="110" font-size="12" fill="#a0a0a0">its login in a vault</text><text x="72" y="129" font-size="12" fill="#a0a0a0">per side</text><g filter="url(#shadow)"><rect x="20" y="170" width="260" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="20" y="182" width="3" height="86" rx="1.5" fill="#6fa3b8"/><svg x="32" y="209" width="32" height="32" viewBox="-6 -6 112 112" overflow="visible"><rect x="12" y="12" width="76" height="76" rx="18" fill="#6fa3b8"/></svg><text x="72" y="202" font-size="14" font-weight="700" fill="#ededed">lovelace</text><text x="72" y="221" font-size="12" fill="#a0a0a0">another account,</text><text x="72" y="240" font-size="12" fill="#a0a0a0">its own vault and</text><text x="72" y="259" font-size="12" fill="#a0a0a0">its own Desktop app</text><rect x="400" y="0" width="230" height="300" rx="16" fill="#0a0a0a" stroke="#2b2b2b" stroke-dasharray="4 4"/><text x="416" y="22" font-size="11" letter-spacing="1" fill="#a0a0a0">THE SLOT</text><g filter="url(#shadow)"><rect x="420" y="40" width="190" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="436" y="72" font-size="14" font-weight="700" fill="#ededed">WSL</text><text x="436" y="91" font-size="12" fill="#a0a0a0">~/.claude</text><text x="436" y="110" font-size="12" fill="#a0a0a0">one login at a</text><text x="436" y="129" font-size="12" fill="#a0a0a0">time, shared history</text><g filter="url(#shadow)"><rect x="420" y="170" width="190" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="436" y="202" font-size="14" font-weight="700" fill="#ededed">Windows</text><text x="436" y="221" font-size="12" fill="#a0a0a0">~/.claude</text><text x="436" y="240" font-size="12" fill="#a0a0a0">the same, on</text><text x="436" y="259" font-size="12" fill="#a0a0a0">the other side</text><path d="M280 95L416 95" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><path d="M280 225L416 225" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#head)"/><rect x="316.4" y="148" width="63.199999999999996" height="24" rx="12" fill="#ededed"/><text x="348" y="164" font-size="12" font-weight="600" text-anchor="middle" fill="#0a0a0a">switch</text><text x="348" y="186" font-size="11" text-anchor="middle" fill="#a0a0a0">on both sides</text><rect x="730" y="0" width="260" height="300" rx="16" fill="#0a0a0a" stroke="#2b2b2b" stroke-dasharray="4 4"/><text x="746" y="22" font-size="11" letter-spacing="1" fill="#a0a0a0">LIVE USAGE</text><g filter="url(#shadow)"><rect x="750" y="40" width="220" height="66" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="766" y="68" font-size="14" font-weight="700" fill="#ededed">dotagents usage</text><text x="766" y="87" font-size="12" fill="#a0a0a0">and the status line</text><g filter="url(#shadow)"><rect x="750" y="116" width="220" height="66" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="766" y="144" font-size="14" font-weight="700" fill="#ededed">dotagents start</text><text x="766" y="163" font-size="12" fill="#a0a0a0">the local API</text><g filter="url(#shadow)"><rect x="750" y="192" width="220" height="88" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="766" y="222" font-size="14" font-weight="700" fill="#ededed">dotagents-sidebar</text><text x="766" y="241" font-size="12" fill="#a0a0a0">the accounts tab and</text><text x="766" y="260" font-size="12" fill="#a0a0a0">the status bar</text><path d="M610 150L726 150" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="668" y="140" font-size="11" text-anchor="middle" fill="#a0a0a0">asks Anthropic</text>
</svg>
