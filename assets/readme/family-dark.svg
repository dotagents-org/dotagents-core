l="#a0a0a0">127.0.0.1</text><path d="M500 95L474 95" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><path d="M500 225L474 225" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><g filter="url(#shadow)"><rect x="720" y="40" width="260" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="736" y="72" font-size="14" font-weight="700" fill="#ededed">the terminal</text><text x="736" y="91" font-size="12" fill="#a0a0a0">usage, switch,</text><text x="736" y="110" font-size="12" fill="#a0a0a0">sessions, check,</text><text x="736" y="129" font-size="12" fill="#a0a0a0">doctor</text><g filter="url(#shadow)"><rect x="720" y="170" width="260" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="720" y="182" width="3" height="86" rx="1.5" fill="#6fa3b8"/><text x="736" y="202" font-size="14" font-weight="700" fill="#ededed">dotagents-sidebar</text><text x="736" y="221" font-size="12" fill="#a0a0a0">VS Code: the sessions,</text><text x="736" y="240" font-size="12" fill="#a0a0a0">the accounts tab and</text><text x="736" y="259" font-size="12" fill="#a0a0a0">the status bar</text><path d="M220 150L316 150" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="268" y="140" font-size="11" text-anchor="middle" fill="#a0a0a0">reads</text><path d="M610 95L716 95" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><path d="M716 225L614 225" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="665" y="215" font-size="11" text-anchor="middle" fill="#a0a0a0">HTTP</text>
