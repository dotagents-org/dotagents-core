<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="Keeping the project's git clean: init applies the standards to a plain folder, and offers to wrap a repository in a workspace" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="337.2" y="8" width="185.6" height="24" rx="12" fill="#ededed"/><text x="430" y="24" font-size="12" font-weight="600" text-anchor="middle" fill="#0a0a0a">dotagents init &lt;folder&gt;</text><path d="M430 32L430 62" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><g filter="url(#shadow)"><rect x="345.7" y="66" width="168.6" height="44" rx="22" fill="#111111" stroke="#ededed" stroke-width="1.4"/></g><text x="430" y="93" font-size="13" font-weight="700" text-anchor="middle" fill="#ededed">a git repository?</text><g filter="url(#shadow)"><rect x="0" y="150" width="260" height="80" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="16" y="176" font-size="14" font-weight="700" fill="#ededed">applied in place</text><text x="16" y="195" font-size="12" fill="#a0a0a0">the standards go into</text><text x="16" y="214" font-size="12" fill="#a0a0a0">the folder itself</text><path d="M346 88C130 88 130 88 130 146" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="238" y="80" font-size="11" text-anchor="middle" fill="#a0a0a0">no</text><g filter="url(#shadow)"><rect x="484.5" y="168" width="231" height="44" rx="22" fill="#111111" stroke="#ededed" stroke-width="1.4"/></g><text x="600" y="195" font-size="13" font-weight="700" text-anchor="middle" fill="#ededed">move it into a workspace?</text><path d="M514 88C600 88 600 88 600 164" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="548" y="80" font-size="11" text-anchor="start" fill="#a0a0a0">yes</text><g filter="url(#shadow)"><rect x="300" y="280" width="330" height="100" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="300" y="292" width="3" height="76" rx="1.5" fill="#e39478"/><text x="316" y="307" font-size="14" font-weight="700" fill="#ededed">&lt;folder&gt;-workspace/</text><text x="316" y="326" font-size="12" fill="#a0a0a0">the agent files at the top,</text><text x="316" y="345" font-size="12" fill="#a0a0a0">&lt;folder&gt;/ inside: the repository,</text><text x="316" y="364" font-size="12" fill="#a0a0a0">with nothing of the agents</text><g filter="url(#shadow)"><rect x="660" y="280" width="300" height="100" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="660" y="292" width="3" height="76" rx="1.5" fill="#6fa3b8"/><text x="676" y="307" font-size="14" font-weight="700" fill="#ededed">kept where it is</text><text x="676" y="326" font-size="12" fill="#a0a0a0">e.g. an Obsidian vault: the</text><text x="676" y="345" font-size="12" fill="#a0a0a0">agent files stay inside, hidden</text><text x="676" y="364" font-size="12" fill="#a0a0a0">by .git/info/exclude</text><path d="M560 214C560 245 465 245 465 276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="495" y="248" font-size="11" text-anchor="end" fill="#a0a0a0">yes, recommended</text><path d="M640 214C640 245 810 245 810 276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="745" y="248" font-size="11" text-anchor="start" fill="#a0a0a0">no</text>
</svg>
