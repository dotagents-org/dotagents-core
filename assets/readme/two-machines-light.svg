<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="124" viewBox="0 0 1060 124" role="img" aria-label="Two machines, one setup: push from one, dotagents update --all on the other" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a1a1a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g filter="url(#shadow)"><rect x="0" y="10" width="260" height="100" rx="12" fill="#ffffff" stroke="#e3e3e3"/></g><rect x="0" y="22" width="3" height="76" rx="1.5" fill="#D77655"/><text x="16" y="37" font-size="14" font-weight="700" fill="#171717">Machine A</text><text x="16" y="56" font-size="12" fill="#666666">edit a skill or a rule:</text><text x="16" y="75" font-size="12" fill="#666666">live at once in every</text><text x="16" y="94" font-size="12" fill="#666666">workspace on A</text><g filter="url(#shadow)"><rect x="400" y="25" width="180" height="70" rx="12" fill="#ffffff" stroke="#e3e3e3"/></g><text x="416" y="55" font-size="14" font-weight="700" fill="#171717">GitHub</text><text x="416" y="74" font-size="12" fill="#666666">your dotagents</text><g filter="url(#shadow)"><rect x="800" y="10" width="260" height="100" rx="12" fill="#ffffff" stroke="#e3e3e3"/></g><rect x="800" y="22" width="3" height="76" rx="1.5" fill="#376B80"/><text x="816" y="37" font-size="14" font-weight="700" fill="#171717">Machine B</text><text x="816" y="56" font-size="12" fill="#666666">pulled, reinstalled,</text><text x="816" y="75" font-size="12" fill="#666666">every workspace</text><text x="816" y="94" font-size="12" fill="#666666">refreshed</text><path d="M260 60L396 60" fill="none" stroke="#a1a1a1" stroke-width="1.6" marker-end="url(#head)"/><rect x="291.2" y="48" width="77.6" height="24" rx="12" fill="#171717"/><text x="330" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">git push</text><path d="M580 60L796 60" fill="none" stroke="#a1a1a1" stroke-width="1.6" marker-end="url(#head)"/><rect x="598.8" y="48" width="178.4" height="24" rx="12" fill="#171717"/><text x="688" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">dotagents update --all</text>
</svg>
