name: Test scripts

on:
  push:
    paths: ["cli.mjs", "package.json", "package-lock.json", "lib/**", "templates/**", "env/**", "AGENTS.md", ".github/workflows/test-scripts.yml"]
  pull_request:
    paths: ["cli.mjs", "package.json", "package-lock.json", "lib/**", "templates/**", "env/**", "AGENTS.md", ".github/workflows/test-scripts.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install + npm link make the dotagents command
        run: |
          echo "DOTAGENTS_STATE_DIR=$RUNNER_TEMP/agents-state" >> "$GITHUB_ENV"
          npm install
          npm link
          dotagents --version
          dotagents skills

      - name: dotagents install is idempotent
        run: |
          dotagents install --dry-run
          dotagents install
          dotagents install | tee second.txt
          ! grep -E '^(created|updated|skipped|failed)' second.txt
          ! grep -F '{{AGENTS_REPO}}' ~/.claude/CLAUDE.md

      - name: dotagents init creates a workspace that passes the checklist
        run: |
          ws="$RUNNER_TEMP/ws"
          mkdir -p "$ws"
          dotagents init "$ws" --skills obsidian-docs,session-archive
          dotagents init "$ws" --skills obsidian-docs,session-archive | tee second.txt
          ! grep -E '^(created|updated|skipped|failed)' second.txt
          dotagents check "$ws"
          test -f "$ws/.agents/skills/obsidian-docs/SKILL.md"
          test -d "$ws/.artifacts/plans"
          grep -F '"plansDirectory": ".artifacts/plans"' "$ws/.claude/settings.json"
          dotagents workspaces | grep -F "ws"

      - name: third-party skills from npx skills live next to the linked ones
        run: |
          ws="$RUNNER_TEMP/ws"
          (cd "$ws" && npx -y skills add blader/humanizer -y -a claude-code codex opencode)
          dotagents check "$ws"
          rm -rf "$ws/.agents/skills/humanizer"
          ! dotagents check "$ws"
          (cd "$ws" && npx -y skills experimental_install -y)
          dotagents check "$ws"

      - name: dotagents update --all refreshes registered workspaces
        run: |
          dotagents update --all --no-pull --dry-run
          dotagents update --all --no-pull

      - name: dotagents untrack stops tracking a workspace without touching its files
        run: |
          ws="$RUNNER_TEMP/ws"
          dotagents untrack "$ws"
          ! dotagents workspaces | grep -F "$(basename "$ws")"
          test -f "$ws/AGENTS.md"

      - name: agent files stay out of a project's git
        run: |
          repo="$RUNNER_TEMP/project"
          mkdir -p "$repo" && cd "$repo" && git init -q
          dotagents init "$repo" --skills to-cards
          test -z "$(git status --porcelain)"
          dotagents check "$repo"
          git add -f AGENTS.md   # simulates an agent file committed by mistake
          ! dotagents check "$repo"
