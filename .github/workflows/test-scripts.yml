name: Test scripts

on:
  push:
    paths: ["cli.ts", "commands/**", "tui/**", "tui/**", "tsconfig.json", "package.json", "package-lock.json", "test/**", "lib/**", "templates/**", "global/**", ".github/workflows/test-scripts.yml"]
  pull_request:
    paths: ["cli.ts", "commands/**", "tsconfig.json", "package.json", "package-lock.json", "test/**", "lib/**", "templates/**", "global/**", ".github/workflows/test-scripts.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install + npm link make the dotagents command
        run: |
          echo "DOTAGENTS_STATE_DIR=$RUNNER_TEMP/agents-state" >> "$GITHUB_ENV"
          npm install
          npm test
          npm link
          dotagents --version
          dotagents skills

      - name: dotagents install is idempotent
        run: |
          dotagents install --dry-run
          dotagents install
          dotagents install | tee second.txt
          ! grep -E '^(created|updated|skipped|failed)' second.txt
          ! grep -F '{{AGENTS_REPO}}' ~/.claude/CLAUDE.md

      - name: dotagents profile sets up two profiles, idempotently
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          export HOME="$home" USERPROFILE="$home"
          dotagents profile add work --default
          dotagents profile add personal --dry-run
          dotagents profile add personal
          dotagents profile add personal | tee second.txt
          ! grep -E '^(created|updated|skipped|failed)' second.txt
          test -f "$home/.claude-personal/CLAUDE.md"
          ls "$home/.local/bin" | grep -F claude-personal
          dotagents profile list
          dotagents usage
          dotagents usage --short
          dotagents usage --json | node -e "JSON.parse(require('fs').readFileSync(0, 'utf8'))"
          dotagents profile remove personal
          test -d "$home/.claude-personal"

      - name: dotagents init creates a workspace that passes the checklist
        run: |
          ws="$RUNNER_TEMP/ws"
          mkdir -p "$ws"
          dotagents init "$ws" --skills obsidian-docs,session-archive
          dotagents init "$ws" --skills obsidian-docs,session-archive | tee second.txt
          ! grep -E '^(created|updated|skipped|failed)' second.txt
          dotagents check "$ws"
          test -f "$ws/.agents/skills/obsidian-docs/SKILL.md"
          test -d "$ws/.artifacts/plans"
          grep -F '"plansDirectory": ".artifacts/plans"' "$ws/.claude/settings.json"
          dotagents workspaces | grep -F "ws"

      - name: third-party skills from npx skills live next to the linked ones
        run: |
          ws="$RUNNER_TEMP/ws"
          (cd "$ws" && npx -y skills add blader/humanizer -y -a claude-code)
          dotagents check "$ws"
          rm -rf "$ws/.agents/skills/humanizer"
          ! dotagents check "$ws"
          (cd "$ws" && npx -y skills experimental_install -y)
          dotagents check "$ws"

      - name: dotagents update --all refreshes registered workspaces
        run: |
          dotagents update --all --no-pull --dry-run
          dotagents update --all --no-pull

      - name: dotagents untrack stops tracking a workspace without touching its files
        run: |
          ws="$RUNNER_TEMP/ws"
          dotagents untrack "$ws"
          ! dotagents workspaces | grep -F "$(basename "$ws")"
          test -f "$ws/AGENTS.md"

      - name: agent files stay out of a project's git
        run: |
          repo="$RUNNER_TEMP/project"
          mkdir -p "$repo" && cd "$repo" && git init -q
          dotagents init "$repo" --skills to-cards
          test -z "$(git status --porcelain)"
          dotagents check "$repo"
          git add -f AGENTS.md   # simulates an agent file committed by mistake
          ! dotagents check "$repo"

      - name: dotagents new wraps repositories in a workspace
        run: |
          cd "$RUNNER_TEMP"
          git init -q --bare app.git && git init -q --bare api.git
          dotagents new "$RUNNER_TEMP/app.git" --skills to-cards
          test -d app-workspace/app/.git && test -f app-workspace/AGENTS.md
          test -z "$(git -C app-workspace/app status --porcelain)"
          dotagents new "$RUNNER_TEMP/api.git" app-workspace --yes
          grep -F '`api/`' app-workspace/AGENTS.md
          dotagents check app-workspace
          ! dotagents new "$RUNNER_TEMP/app.git" app-workspace --yes

      - name: third-party skills registered once are offered by init
        run: |
          dotagents skills add blader/humanizer
          grep -F '"humanizer"' skills/third-party-skills.json
          ws="$RUNNER_TEMP/tp"
          mkdir -p "$ws"
          dotagents init "$ws" --skills to-cards,humanizer
          test -f "$ws/.agents/skills/humanizer/SKILL.md"
          grep -F humanizer "$ws/skills-lock.json"
          dotagents check "$ws"
          ! dotagents init "$ws" --skills not-a-skill
          only="$RUNNER_TEMP/only-third-party"
          mkdir -p "$only"
          dotagents init "$only" --skills humanizer
          dotagents check "$only"
