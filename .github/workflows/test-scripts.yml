name: Test scripts

on:
  push:
    paths: ["cli.mjs", "package.json", "lib/**", "templates/**", "env/**", "AGENTS.md", ".github/workflows/test-scripts.yml"]
  pull_request:
    paths: ["cli.mjs", "package.json", "lib/**", "templates/**", "env/**", "AGENTS.md", ".github/workflows/test-scripts.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      AGENTS_STATE_DIR: ${{ runner.temp }}/agents-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm link makes the agents command
        run: |
          npm link
          agents --version
          agents skills

      - name: agents install is idempotent
        run: |
          agents install --dry-run
          agents install
          agents install | tee second.txt
          ! grep -E '^(created|updated|skipped|failed)' second.txt
          ! grep -F '{{AGENTS_REPO}}' ~/.claude/CLAUDE.md

      - name: agents init creates a workspace that passes the checklist
        run: |
          ws="$RUNNER_TEMP/ws"
          mkdir -p "$ws"
          agents init "$ws" --skills obsidian-docs,session-archive
          agents init "$ws" --skills obsidian-docs,session-archive | tee second.txt
          ! grep -E '^(created|updated|skipped|failed)' second.txt
          agents check "$ws"
          test -f "$ws/.agents/skills/obsidian-docs/SKILL.md"
          agents workspaces | grep -F "ws"

      - name: third-party skills from npx skills live next to the linked ones
        run: |
          ws="$RUNNER_TEMP/ws"
          (cd "$ws" && npx -y skills add blader/humanizer -y -a claude-code codex opencode)
          agents check "$ws"
          rm -rf "$ws/.agents/skills/humanizer"
          ! agents check "$ws"
          (cd "$ws" && npx -y skills experimental_install -y)
          agents check "$ws"

      - name: agents update --all refreshes registered workspaces
        run: |
          agents update --all --no-pull --dry-run
          agents update --all --no-pull
