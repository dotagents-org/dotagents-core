name: Validate skills

on:
  push:
    paths: ["config/skills/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["config/skills/**", ".github/workflows/validate.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
      - name: Validate each skill
        run: |
          status=0
          for dir in config/skills/*/; do
            echo "::group::$dir"
            skills-ref validate "$dir" || status=1
            echo "::endgroup::"
          done
          exit $status
